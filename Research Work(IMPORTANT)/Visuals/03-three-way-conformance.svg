<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">Three-way conformance</text>
  <text x="40" y="68" font-size="16" fill="#6b6b6b">Every tool on the market compares two things. The third reference is what they cannot see.</text>
  <line x1="40" y1="84" x2="960" y2="84" stroke="#d4d0c8" stroke-width="1"/>

  <!-- three sources -->
  <rect x="60" y="112" width="230" height="86" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.3"/>
  <text x="175" y="142" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a">Legacy COBOL</text>
  <text x="175" y="165" font-size="14" text-anchor="middle" fill="#6b6b6b">what the bank does today</text>
  <text x="175" y="186" font-size="14" text-anchor="middle" fill="#6b6b6b">&#8212; the current answer</text>

  <rect x="385" y="112" width="230" height="86" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.3"/>
  <text x="500" y="142" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a">Reimplementation</text>
  <text x="500" y="165" font-size="14" text-anchor="middle" fill="#6b6b6b">generated Java</text>
  <text x="500" y="186" font-size="14" text-anchor="middle" fill="#6b6b6b">&#8212; untrusted by design</text>

  <rect x="710" y="112" width="230" height="86" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.8"/>
  <text x="825" y="142" font-size="18" font-weight="600" text-anchor="middle" fill="#1f4468">RBI Master Direction</text>
  <text x="825" y="165" font-size="14" text-anchor="middle" fill="#2c5f8a">daily product basis &#183; nearest</text>
  <text x="825" y="186" font-size="14" text-anchor="middle" fill="#2c5f8a">rupee &#183; &#8377;1 lakh threshold</text>
  <text x="825" y="216" font-size="13" font-weight="600" text-anchor="middle" fill="#2c5f8a">OUR ADDITION</text>

  <!-- converge -->
  <path d="M175 198 L175 244 L500 244" stroke="#6b6b6b" stroke-width="1.5" fill="none"/>
  <path d="M825 228 L825 244 L500 244" stroke="#2c5f8a" stroke-width="1.5" fill="none"/>
  <path d="M500 198 L500 268" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="380" y="272" width="240" height="44" rx="4" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.5"/>
  <text x="500" y="300" font-size="17" font-weight="600" text-anchor="middle" fill="#4a3266">Same input, three outputs</text>

  <path d="M500 316 L500 340" stroke="#6b6b6b" stroke-width="1.5"/>
  <path d="M175 340 L825 340" stroke="#6b6b6b" stroke-width="1.5"/>

  <!-- four outcome cells -->
  <path d="M175 340 L175 358" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M392 340 L392 358" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M608 340 L608 358" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M825 340 L825 358" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- cell 1 verified -->
  <rect x="60" y="362" width="230" height="150" rx="4" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.4"/>
  <text x="175" y="390" font-size="15" font-family="Consolas, monospace" text-anchor="middle" fill="#1a4f38">L = R = Reg</text>
  <line x1="86" y1="402" x2="264" y2="402" stroke="#a9c9b8"/>
  <text x="175" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#1a4f38">Verified compliant</text>
  <text x="175" y="456" font-size="14" text-anchor="middle" fill="#2e7d5b">Nothing to do.</text>
  <text x="175" y="476" font-size="14" text-anchor="middle" fill="#2e7d5b">This is what a sign-off</text>
  <text x="175" y="494" font-size="14" text-anchor="middle" fill="#2e7d5b">is actually made of.</text>

  <!-- cell 2 translation defect -->
  <rect x="277" y="362" width="230" height="150" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.4"/>
  <text x="392" y="390" font-size="15" font-family="Consolas, monospace" text-anchor="middle" fill="#8f2f21">L &#8800; R</text>
  <line x1="303" y1="402" x2="481" y2="402" stroke="#e0b3aa"/>
  <text x="392" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#8f2f21">Translation defect</text>
  <text x="392" y="456" font-size="14" text-anchor="middle" fill="#8f2f21">The rewrite is wrong.</text>
  <text x="392" y="482" font-size="13" font-style="italic" text-anchor="middle" fill="#8f2f21">The only cell a two-way</text>
  <text x="392" y="500" font-size="13" font-style="italic" text-anchor="middle" fill="#8f2f21">tool can see.</text>

  <!-- cell 3 inherited compliance defect -->
  <rect x="493" y="362" width="230" height="150" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="2"/>
  <text x="608" y="390" font-size="15" font-family="Consolas, monospace" text-anchor="middle" fill="#1f4468">L = R &#8800; Reg</text>
  <line x1="519" y1="402" x2="697" y2="402" stroke="#a9bdd4"/>
  <text x="608" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#1f4468">Inherited breach</text>
  <text x="608" y="454" font-size="14" text-anchor="middle" fill="#2c5f8a">The rewrite faithfully</text>
  <text x="608" y="472" font-size="14" text-anchor="middle" fill="#2c5f8a">reproduces a breach that</text>
  <text x="608" y="490" font-size="14" text-anchor="middle" fill="#2c5f8a">has run for 40 years.</text>
  <text x="608" y="506" font-size="13" font-weight="600" text-anchor="middle" fill="#1f4468">Invisible to everyone else.</text>

  <!-- cell 4 silent correction -->
  <rect x="710" y="362" width="230" height="150" rx="4" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.4"/>
  <text x="825" y="390" font-size="15" font-family="Consolas, monospace" text-anchor="middle" fill="#7a5a08">L &#8800; R = Reg</text>
  <line x1="736" y1="402" x2="914" y2="402" stroke="#ddc98a"/>
  <text x="825" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#7a5a08">Silent correction</text>
  <text x="825" y="454" font-size="14" text-anchor="middle" fill="#7a5a08">The rewrite &#8220;fixed&#8221; it.</text>
  <text x="825" y="474" font-size="14" text-anchor="middle" fill="#7a5a08">Not a win &#8212; the books</text>
  <text x="825" y="492" font-size="14" text-anchor="middle" fill="#7a5a08">change at cutover, and</text>
  <text x="825" y="510" font-size="14" text-anchor="middle" fill="#7a5a08">someone must authorise it.</text>

  <!-- footer -->
  <rect x="60" y="536" width="880" height="60" rx="4" fill="#f7f5f2" stroke="#d4d0c8" stroke-width="1"/>
  <text x="84" y="562" font-size="16" fill="#1a1a1a">&#8220;The legacy system is its own oracle&#8221; is true for <tspan font-style="italic">equivalence</tspan> and false for <tspan font-style="italic">correctness</tspan>.</text>
  <text x="84" y="584" font-size="16" fill="#1a1a1a">The gap between those two words is where a compliance finding lives &#8212; and no migration product is looking there.</text>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
</svg>
