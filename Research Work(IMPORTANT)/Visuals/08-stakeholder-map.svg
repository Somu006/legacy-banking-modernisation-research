<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="590" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">Four people are stuck on the same missing artefact</text>
  <line x1="40" y1="60" x2="960" y2="60" stroke="#d4d0c8" stroke-width="1"/>

  <text x="40" y="96" font-size="13" letter-spacing="1.4" fill="#8a8a8a">TARGET USERS AND STAKEHOLDERS</text>

  <!-- card 1: CIO -->
  <rect x="40" y="112" width="440" height="122" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="64" y="144" font-size="18" font-weight="600" fill="#1a1a1a">Bank CIO / head of core banking</text>
  <text x="64" y="168" font-size="14" fill="#6b6b6b">Owns the migration decision and the cutover date</text>
  <text x="64" y="196" font-size="15" fill="#b3402f">Cannot sign off a replacement nobody can prove</text>
  <text x="64" y="216" font-size="15" fill="#b3402f">behaves identically</text>

  <!-- card 2: risk -->
  <rect x="520" y="112" width="440" height="122" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="544" y="144" font-size="18" font-weight="600" fill="#1a1a1a">Risk, compliance and internal audit</text>
  <text x="544" y="168" font-size="14" fill="#6b6b6b">Owns the Change Management Policy RBI requires (2023)</text>
  <text x="544" y="196" font-size="15" fill="#b3402f">No auditable artefact showing old and new agree,</text>
  <text x="544" y="216" font-size="15" fill="#b3402f">case by case</text>

  <!-- card 3: SIs -->
  <rect x="40" y="258" width="440" height="122" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="64" y="290" font-size="18" font-weight="600" fill="#1a1a1a">Modernisation vendors and SIs</text>
  <text x="64" y="314" font-size="14" fill="#6b6b6b">Cognizant · TCS · Infosys · in-house delivery teams</text>
  <text x="64" y="342" font-size="15" fill="#b3402f">Translation is commoditised; assurance is what</text>
  <text x="64" y="362" font-size="15" fill="#b3402f">stretches the programme</text>

  <!-- card 4: supervisor -->
  <rect x="520" y="258" width="440" height="122" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="544" y="290" font-size="18" font-weight="600" fill="#1f4468">The supervisor</text>
  <text x="544" y="314" font-size="14" fill="#2c5f8a">RBI, and the bank's own board</text>
  <text x="544" y="342" font-size="15" fill="#b3402f">An IT failure is a supervisory event,</text>
  <text x="544" y="362" font-size="15" fill="#b3402f">not an engineering incident</text>

  <!-- converging arrows -->
  <path d="M260 234 L440 428" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ar8)"/>
  <path d="M740 234 L560 428" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ar8)"/>
  <path d="M260 380 L420 440" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ar8)"/>
  <path d="M740 380 L580 440" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ar8)"/>

  <!-- the missing artefact -->
  <rect x="270" y="432" width="460" height="78" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="500" y="464" font-size="18" font-weight="600" text-anchor="middle" fill="#8f2f21">The cutover memo</text>
  <text x="500" y="490" font-size="15" text-anchor="middle" fill="#8f2f21">the artefact everyone needs and nobody can produce today</text>

  <text x="40" y="552" font-size="17" font-weight="600" fill="#1a1a1a">Nobody on this list is short of a translator. Everybody on this list is short of proof.</text>
  <text x="40" y="576" font-size="14" fill="#8a8a8a">Roles are sourced; the pain statements are the team's inference — recorded as assumptions in 08 §1.</text>

  <defs>
    <marker id="ar8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
</svg>
