<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">Testing our own tests</text>
  <text x="40" y="68" font-size="16" fill="#6b6b6b">&#8220;Everything passed&#8221; proves nothing unless the inputs could have caught a failure. So we break the legacy on purpose.</text>
  <line x1="40" y1="84" x2="960" y2="84" stroke="#d4d0c8" stroke-width="1"/>

  <!-- original -->
  <rect x="60" y="112" width="200" height="70" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.3"/>
  <text x="160" y="140" font-size="17" font-weight="600" text-anchor="middle" fill="#1a1a1a">Legacy COBOL</text>
  <text x="160" y="163" font-size="14" text-anchor="middle" fill="#6b6b6b">the oracle</text>

  <path d="M260 147 L316 147" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a5)"/>

  <!-- mutate -->
  <rect x="322" y="106" width="356" height="82" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.5"/>
  <text x="500" y="132" font-size="17" font-weight="600" text-anchor="middle" fill="#8f2f21">Inject a deliberate defect</text>
  <text x="500" y="156" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#8f2f21">100000 &#8594; 100001   &#183;   &gt; &#8594; &gt;=   &#183;   delete ROUNDED</text>
  <text x="500" y="177" font-size="14" font-family="Consolas, monospace" text-anchor="middle" fill="#8f2f21">V99 &#8594; V999   &#183;   3.5 &#8594; 3.6   &#183;   360 &#8594; 365</text>

  <path d="M678 147 L734 147" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="740" y="112" width="200" height="70" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="840" y="140" font-size="17" font-weight="600" text-anchor="middle" fill="#1a1a1a">Mutant</text>
  <text x="840" y="163" font-size="14" text-anchor="middle" fill="#6b6b6b">knowingly wrong</text>

  <!-- run corpus -->
  <path d="M840 182 L840 210 L500 210 L500 238" stroke="#6b6b6b" stroke-width="1.5" fill="none" marker-end="url(#a5)"/>
  <rect x="330" y="242" width="340" height="52" rx="4" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="500" y="264" font-size="16" font-weight="600" text-anchor="middle" fill="#7a5a08">Re-run the same input corpus</text>
  <text x="500" y="284" font-size="14" text-anchor="middle" fill="#7a5a08">did any input notice the difference?</text>

  <path d="M500 294 L500 318" stroke="#6b6b6b" stroke-width="1.5"/>
  <path d="M280 318 L720 318" stroke="#6b6b6b" stroke-width="1.5"/>
  <path d="M280 318 L280 340" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#agreen5)"/>
  <path d="M720 318 L720 340" stroke="#b3402f" stroke-width="1.6" marker-end="url(#ared5)"/>

  <!-- killed -->
  <rect x="120" y="344" width="320" height="112" rx="4" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.5"/>
  <text x="280" y="372" font-size="18" font-weight="600" text-anchor="middle" fill="#1a4f38">Mutant killed</text>
  <text x="280" y="398" font-size="15" text-anchor="middle" fill="#2e7d5b">The corpus caught it.</text>
  <text x="280" y="420" font-size="15" text-anchor="middle" fill="#2e7d5b">Our inputs really do exercise</text>
  <text x="280" y="440" font-size="15" text-anchor="middle" fill="#2e7d5b">that threshold. Claim stands.</text>

  <!-- survived -->
  <rect x="560" y="344" width="320" height="112" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.5"/>
  <text x="720" y="372" font-size="18" font-weight="600" text-anchor="middle" fill="#8f2f21">Mutant survived</text>
  <text x="720" y="398" font-size="15" text-anchor="middle" fill="#8f2f21">Nobody noticed a one-rupee</text>
  <text x="720" y="420" font-size="15" text-anchor="middle" fill="#8f2f21">change to the threshold.</text>
  <text x="720" y="440" font-size="15" font-weight="600" text-anchor="middle" fill="#8f2f21">Downgrade that rule to unproven.</text>

  <!-- outcome -->
  <path d="M280 456 L280 476 L500 476" stroke="#6b6b6b" stroke-width="1.4" fill="none"/>
  <path d="M720 456 L720 476 L500 476" stroke="#6b6b6b" stroke-width="1.4" fill="none"/>
  <path d="M500 476 L500 496" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#a5)"/>
  <rect x="60" y="500" width="880" height="46" rx="4" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.4"/>
  <text x="500" y="529" font-size="17" font-weight="600" text-anchor="middle" fill="#4a3266">The equivalence claim ships with its own strength score &#8212; measured, per rule, not asserted.</text>

  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
    <marker id="ared5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402f"/>
    </marker>
    <marker id="agreen5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d5b"/>
    </marker>
  </defs>
</svg>
