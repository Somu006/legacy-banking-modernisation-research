<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">System architecture</text>
  <text x="40" y="68" font-size="16" fill="#6b6b6b">A deterministic pipeline with bounded LLM calls. Shaded stages carry the novelty.</text>
  <line x1="40" y1="84" x2="960" y2="84" stroke="#d4d0c8" stroke-width="1"/>

  <!-- legend -->
  <rect x="700" y="100" width="16" height="16" rx="2" fill="#f7f5f2" stroke="#b8b2a8"/>
  <text x="724" y="113" font-size="14" fill="#6b6b6b">deterministic</text>
  <rect x="816" y="100" width="16" height="16" rx="2" fill="#eef1f7" stroke="#2c5f8a"/>
  <text x="840" y="113" font-size="14" fill="#6b6b6b">LLM call</text>

  <!-- input -->
  <rect x="400" y="132" width="200" height="52" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="500" y="164" font-size="18" font-weight="600" text-anchor="middle" fill="#1a1a1a">COBOL source</text>

  <!-- intake gate -->
  <path d="M500 184 L500 206" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="336" y="210" width="328" height="56" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="500" y="234" font-size="17" font-weight="600" text-anchor="middle" fill="#1a1a1a">0 · Intake gate</text>
  <text x="500" y="254" font-size="13" text-anchor="middle" fill="#6b6b6b">CICS / SQL / clock detected &#8594; refuse with reason</text>
  <path d="M664 238 L710 238" stroke="#b3402f" stroke-width="1.4" marker-end="url(#ared)"/>
  <text x="718" y="234" font-size="14" font-weight="600" fill="#b3402f">REFUSED</text>
  <text x="718" y="252" font-size="13" fill="#b3402f">non-deterministic</text>

  <!-- three columns -->
  <path d="M500 266 L500 288" stroke="#6b6b6b" stroke-width="1.6"/>
  <path d="M180 288 L820 288" stroke="#6b6b6b" stroke-width="1.6"/>
  <path d="M180 288 L180 308" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M500 288 L500 308" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M820 288 L820 308" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- left: compile -->
  <rect x="70" y="312" width="220" height="52" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="180" y="336" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a">4 · Compile legacy</text>
  <text x="180" y="355" font-size="14" text-anchor="middle" fill="#6b6b6b">GnuCOBOL + coverage</text>

  <!-- middle: parse -->
  <rect x="390" y="312" width="220" height="52" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="500" y="336" font-size="16" font-weight="600" text-anchor="middle" fill="#1a1a1a">1&#8211;2 · Parse &amp; slice</text>
  <text x="500" y="355" font-size="14" text-anchor="middle" fill="#6b6b6b">ProLeap AST &#8594; rule slices</text>

  <!-- right: translate -->
  <rect x="710" y="312" width="220" height="52" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.3"/>
  <text x="820" y="336" font-size="16" font-weight="600" text-anchor="middle" fill="#1f4468">6 · Translate</text>
  <text x="820" y="355" font-size="13" text-anchor="middle" fill="#2c5f8a">Java &#8212; untrusted by design</text>

  <!-- extract -->
  <path d="M500 364 L500 388" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="360" y="392" width="280" height="62" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.3"/>
  <text x="500" y="416" font-size="16" font-weight="600" text-anchor="middle" fill="#1f4468">3 · Extract rules</text>
  <text x="500" y="435" font-size="14" text-anchor="middle" fill="#2c5f8a">one call per slice · line citations written</text>
  <text x="500" y="450" font-size="14" text-anchor="middle" fill="#2c5f8a">by the pipeline, not the model</text>

  <!-- generate inputs -->
  <path d="M500 454 L500 478" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="306" y="482" width="388" height="66" rx="4" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="500" y="506" font-size="16" font-weight="600" text-anchor="middle" fill="#7a5a08">5 · Rule-directed input generation</text>
  <text x="500" y="526" font-size="14" text-anchor="middle" fill="#7a5a08">the rules say where the boundaries are:</text>
  <text x="500" y="543" font-size="13" text-anchor="middle" fill="#7a5a08">&#8377;99,999 / &#8377;1,00,000 / &#8377;1,00,001 &#183; &#8377;0.50 midpoints &#183; 29 Feb</text>

  <!-- feeds back to both sides -->
  <path d="M400 482 L400 468 L180 468 L180 372" stroke="#b8860b" stroke-width="1.3" fill="none" marker-end="url(#agold)"/>
  <path d="M600 482 L600 468 L820 468 L820 372" stroke="#b8860b" stroke-width="1.3" fill="none" marker-end="url(#agold)"/>

  <!-- regulation model -->
  <rect x="70" y="482" width="200" height="66" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="170" y="506" font-size="16" font-weight="600" text-anchor="middle" fill="#1f4468">8 · Regulation model</text>
  <text x="170" y="526" font-size="14" text-anchor="middle" fill="#2c5f8a">RBI Master Direction,</text>
  <text x="170" y="543" font-size="14" text-anchor="middle" fill="#2c5f8a">~60 lines, clause-cited</text>

  <!-- execute -->
  <path d="M500 548 L500 572" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M170 548 L170 586 L344 586" stroke="#2c5f8a" stroke-width="1.4" fill="none" marker-end="url(#ablue)"/>
  <rect x="350" y="576" width="300" height="50" rx="4" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.5"/>
  <text x="500" y="598" font-size="16" font-weight="600" text-anchor="middle" fill="#4a3266">7&#8211;9 · Execute and compare, three ways</text>
  <text x="500" y="617" font-size="14" text-anchor="middle" fill="#6b4a8a">legacy &#183; rewrite &#183; regulation</text>

  <!-- outputs -->
  <path d="M500 626 L500 644" stroke="#6b6b6b" stroke-width="1.6"/>
  <path d="M180 644 L820 644" stroke="#6b6b6b" stroke-width="1.6"/>
  <path d="M180 644 L180 660" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M500 644 L500 660" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M820 644 L820 660" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a2)"/>

  <text x="180" y="682" font-size="15" font-weight="600" text-anchor="middle" fill="#1a1a1a">11 &#183; Rule verdicts</text>
  <text x="180" y="698" font-size="13" text-anchor="middle" fill="#6b6b6b">proven / unproven / refuted</text>
  <text x="500" y="682" font-size="15" font-weight="600" text-anchor="middle" fill="#1a1a1a">12 &#183; Mutation score</text>
  <text x="500" y="698" font-size="13" text-anchor="middle" fill="#6b6b6b">how strong is this claim?</text>
  <text x="820" y="682" font-size="15" font-weight="600" text-anchor="middle" fill="#1a1a1a">14 &#183; Evidence bundle</text>
  <text x="820" y="698" font-size="13" text-anchor="middle" fill="#6b6b6b">spec · tests · signed claim</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402f"/>
    </marker>
    <marker id="agold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c5f8a"/>
    </marker>
  </defs>
</svg>
