<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">What the tool actually hands you</text>
  <text x="40" y="68" font-size="16" fill="#6b6b6b">Illustrative output for a savings-interest accrual program. The unproven and refuted columns are the point.</text>
  <line x1="40" y1="84" x2="960" y2="84" stroke="#d4d0c8" stroke-width="1"/>

  <!-- headline tiles -->
  <rect x="40" y="106" width="212" height="88" rx="4" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.4"/>
  <text x="146" y="148" font-size="34" font-weight="600" text-anchor="middle" fill="#1a4f38">31</text>
  <text x="146" y="172" font-size="15" text-anchor="middle" fill="#2e7d5b">rules proven</text>

  <rect x="264" y="106" width="212" height="88" rx="4" fill="#fdf6e6" stroke="#b8860b" stroke-width="1.4"/>
  <text x="370" y="148" font-size="34" font-weight="600" text-anchor="middle" fill="#7a5a08">11</text>
  <text x="370" y="172" font-size="15" text-anchor="middle" fill="#7a5a08">unproven &#8212; named</text>

  <rect x="488" y="106" width="212" height="88" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.4"/>
  <text x="594" y="148" font-size="34" font-weight="600" text-anchor="middle" fill="#8f2f21">5</text>
  <text x="594" y="172" font-size="15" text-anchor="middle" fill="#8f2f21">refuted &#8212; our AI was wrong</text>

  <rect x="712" y="106" width="248" height="88" rx="4" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.4"/>
  <text x="836" y="148" font-size="34" font-weight="600" text-anchor="middle" fill="#4a3266">94%</text>
  <text x="836" y="172" font-size="15" text-anchor="middle" fill="#6b4a8a">mutation kill rate</text>

  <!-- divergence -->
  <text x="40" y="232" font-size="13" letter-spacing="1.4" fill="#8a8a8a">DIVERGENCE &#183; MINIMISED BY DELTA DEBUGGING</text>
  <rect x="40" y="242" width="920" height="96" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.3"/>
  <text x="64" y="270" font-size="15" font-family="Consolas, monospace" fill="#8f2f21">input:  balance = 1,00,000.00   days = 12   rate = 3.5%</text>
  <text x="64" y="292" font-size="15" font-family="Consolas, monospace" fill="#8f2f21">legacy  &#8594; &#8377;115        rewrite &#8594; &#8377;116        &#916; = &#8377;1 per account per accrual</text>
  <text x="64" y="318" font-size="15" fill="#8f2f21">Traced to R-07, line 214. The Java uses <tspan font-family="Consolas, monospace">RoundingMode.HALF_UP</tspan>; the COBOL truncates at the PIC boundary.</text>

  <!-- refuted -->
  <text x="40" y="374" font-size="13" letter-spacing="1.4" fill="#8a8a8a">REFUTED RULE &#183; THE EXTRACTION LAYER HALLUCINATED THIS</text>
  <rect x="40" y="384" width="920" height="92" rx="4" fill="#ffffff" stroke="#b3402f" stroke-width="1.6"/>
  <text x="64" y="412" font-size="15" fill="#1a1a1a">R-11 &#8212; &#8220;Accounts dormant for more than 24 months accrue at the base rate.&#8221;   <tspan font-family="Consolas, monospace" fill="#8f2f21">lines 331&#8211;348</tspan></text>
  <text x="64" y="436" font-size="15" fill="#6b6b6b">Lines executed on 214 inputs. Dormancy of 23 and 25 months produced <tspan font-weight="600" fill="#8f2f21">identical output in both implementations</tspan>.</text>
  <text x="64" y="460" font-size="15" fill="#6b6b6b">No such boundary exists in the program. An engineer would have built on this rule.</text>

  <!-- compliance -->
  <text x="40" y="512" font-size="13" letter-spacing="1.4" fill="#8a8a8a">COMPLIANCE FINDING &#183; VISIBLE ONLY WITH THE THIRD REFERENCE</text>
  <rect x="40" y="522" width="920" height="82" rx="4" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="64" y="550" font-size="15" fill="#1f4468">Legacy and rewrite <tspan font-weight="600">agree</tspan>: both round interest to two decimal places.</text>
  <text x="64" y="574" font-size="15" fill="#1f4468">RBI Master Direction (Interest Rate on Deposits): payment of interest on rupee deposits is rounded to the <tspan font-weight="600">nearest rupee</tspan>.</text>
  <text x="64" y="596" font-size="15" fill="#2c5f8a">Not a migration defect. Warrants compliance review of the existing system.</text>
</svg>
