<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">The bottleneck is verification, not translation</text>
  <line x1="40" y1="60" x2="960" y2="60" stroke="#d4d0c8" stroke-width="1"/>

  <!-- lane label -->
  <text x="40" y="96" font-size="13" letter-spacing="1.4" fill="#8a8a8a">THE SOLVED HALF</text>

  <!-- COBOL -->
  <rect x="40" y="112" width="180" height="104" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="130" y="150" font-size="19" font-weight="600" text-anchor="middle" fill="#1a1a1a">COBOL source</text>
  <text x="130" y="174" font-size="15" text-anchor="middle" fill="#6b6b6b">4,000 lines · 1987</text>
  <text x="130" y="196" font-size="15" text-anchor="middle" fill="#6b6b6b">~200 undocumented edits</text>

  <path d="M228 164 L282 164" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- translate -->
  <rect x="290" y="112" width="180" height="104" rx="4" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.4"/>
  <text x="380" y="150" font-size="19" font-weight="600" text-anchor="middle" fill="#1a4f38">Translate</text>
  <text x="380" y="174" font-size="15" text-anchor="middle" fill="#2e7d5b">transpilers · LLMs</text>
  <text x="380" y="196" font-size="15" text-anchor="middle" fill="#2e7d5b">AWS · IBM · TCS ship this</text>

  <path d="M478 164 L532 164" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- java -->
  <rect x="540" y="112" width="180" height="104" rx="4" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="630" y="150" font-size="19" font-weight="600" text-anchor="middle" fill="#1a1a1a">Modern Java</text>
  <text x="630" y="174" font-size="15" text-anchor="middle" fill="#6b6b6b">compiles · passes</text>
  <text x="630" y="196" font-size="15" text-anchor="middle" fill="#6b6b6b">the tests you wrote</text>

  <!-- barrier -->
  <rect x="754" y="88" width="34" height="152" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.4"/>
  <line x1="754" y1="88" x2="788" y2="122" stroke="#b3402f" stroke-width="1"/>
  <line x1="754" y1="122" x2="788" y2="156" stroke="#b3402f" stroke-width="1"/>
  <line x1="754" y1="156" x2="788" y2="190" stroke="#b3402f" stroke-width="1"/>
  <line x1="754" y1="190" x2="788" y2="224" stroke="#b3402f" stroke-width="1"/>
  <line x1="754" y1="206" x2="788" y2="240" stroke="#b3402f" stroke-width="1"/>
  <path d="M728 164 L748 164" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- production -->
  <rect x="812" y="112" width="148" height="104" rx="4" fill="#ffffff" stroke="#cfcac2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="886" y="158" font-size="19" font-weight="600" text-anchor="middle" fill="#a09a92">Production</text>
  <text x="886" y="184" font-size="15" text-anchor="middle" fill="#a09a92">never reached</text>

  <!-- the blocking question -->
  <path d="M771 240 L771 268" stroke="#b3402f" stroke-width="1.6"/>
  <rect x="40" y="272" width="920" height="90" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.4"/>
  <text x="64" y="304" font-size="19" font-weight="600" fill="#8f2f21">Can anyone prove the new program behaves identically to the old one?</text>
  <text x="64" y="332" font-size="16" fill="#8f2f21">No specification was ever written. The rules exist only in the code. The engineers who added them have retired.</text>
  <text x="64" y="352" font-size="16" fill="#8f2f21">IBM Research, on IBM's own translation product: &#8220;the resulting code cannot be trusted to correctly translate the original code.&#8221;</text>

  <!-- consequence -->
  <text x="40" y="400" font-size="13" letter-spacing="1.4" fill="#8a8a8a">THE CONSEQUENCE</text>
  <text x="40" y="428" font-size="17" fill="#1a1a1a">A one-paisa drift across millions of accounts is a regulatory event, not a bug report. So the bank rationally keeps</text>
  <text x="40" y="452" font-size="17" fill="#1a1a1a">running software it cannot safely change &#8212; and the modernisation backlog is measured in decades, not quarters.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
  </defs>
</svg>
