<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="25" font-weight="600" fill="#1a1a1a">Twelve weeks to the contribution, six months to a pilot</text>
  <line x1="40" y1="60" x2="960" y2="60" stroke="#d4d0c8" stroke-width="1"/>

  <text x="40" y="96" font-size="13" letter-spacing="1.4" fill="#8a8a8a">PROTOTYPE — 4 ENGINEERS, COMMODITY LAPTOPS</text>

  <!-- week grid: week w spans x = 240 + (w-1)*60, width 60 -->
  <g font-size="11" fill="#a09a92" text-anchor="middle">
    <text x="270" y="120">w1</text><text x="330" y="120">w2</text>
    <text x="390" y="120">w3</text><text x="450" y="120">w4</text>
    <text x="510" y="120">w5</text><text x="570" y="120">w6</text>
    <text x="630" y="120">w7</text><text x="690" y="120">w8</text>
    <text x="750" y="120">w9</text><text x="810" y="120">w10</text>
    <text x="870" y="120">w11</text><text x="930" y="120">w12</text>
  </g>
  <g stroke="#e8e4de" stroke-width="1">
    <line x1="240" y1="128" x2="240" y2="392"/>
    <line x1="360" y1="128" x2="360" y2="392"/>
    <line x1="480" y1="128" x2="480" y2="392"/>
    <line x1="660" y1="128" x2="660" y2="392"/>
    <line x1="840" y1="128" x2="840" y2="392"/>
    <line x1="960" y1="128" x2="960" y2="392"/>
  </g>

  <!-- rows -->
  <text x="40" y="160" font-size="14" fill="#1a1a1a">Differential harness</text>
  <rect x="240" y="140" width="120" height="30" rx="3" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="300" y="160" font-size="12" text-anchor="middle" fill="#1a4f38">already a demo</text>

  <text x="40" y="212" font-size="14" fill="#1a1a1a">Input generation</text>
  <rect x="360" y="192" width="120" height="30" rx="3" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="420" y="212" font-size="12" text-anchor="middle" fill="#6b6b6b">PIC + boundaries</text>

  <text x="40" y="264" font-size="14" fill="#1a1a1a">Rule extraction</text>
  <rect x="480" y="244" width="180" height="30" rx="3" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="570" y="264" font-size="12" text-anchor="middle" fill="#6b6b6b">slice · line citations</text>

  <text x="40" y="316" font-size="14" font-weight="600" fill="#4a3266">Reciprocal loop + verdicts</text>
  <rect x="660" y="296" width="180" height="30" rx="3" fill="#f3eef7" stroke="#6b4a8a" stroke-width="1.6"/>
  <text x="750" y="316" font-size="12" font-weight="600" text-anchor="middle" fill="#4a3266">THE CONTRIBUTION</text>

  <text x="40" y="368" font-size="14" fill="#1a1a1a">Delta debug · evidence</text>
  <rect x="840" y="348" width="120" height="30" rx="3" fill="#f7f5f2" stroke="#b8b2a8" stroke-width="1.2"/>
  <text x="900" y="368" font-size="12" text-anchor="middle" fill="#6b6b6b">minimal cases</text>

  <!-- pilot -->
  <text x="40" y="424" font-size="13" letter-spacing="1.4" fill="#8a8a8a">THEN — BANK PILOT, MONTHS 4–9</text>
  <rect x="240" y="436" width="720" height="34" rx="3" fill="#eef1f7" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="600" y="458" font-size="13" text-anchor="middle" fill="#1f4468">2 engineers + bank SME time · one program family · the bank's own compiler environment — the harness is unchanged</text>

  <!-- investments / returns strip -->
  <rect x="40" y="490" width="450" height="52" rx="4" fill="#eef4ef" stroke="#2e7d5b" stroke-width="1.2"/>
  <text x="62" y="511" font-size="13" font-weight="600" fill="#1a4f38">Licence cost: nil · variable cost: bounded LLM calls only.</text>
  <text x="62" y="530" font-size="12.5" fill="#2e7d5b">GnuCOBOL · ProLeap · gcov · NIST · CardDemo — all open.</text>

  <rect x="510" y="490" width="450" height="52" rx="4" fill="#fbeeeb" stroke="#b3402f" stroke-width="1.2"/>
  <text x="532" y="511" font-size="13" font-weight="600" fill="#8f2f21">The counterfactual: TSB 2018 — ~£400m.</text>
  <text x="532" y="530" font-size="12.5" fill="#8f2f21">The downside is two orders of magnitude above the platform's cost.</text>

  <text x="40" y="557" font-size="11.5" fill="#a09a92">Stage contents and risks researched (04 §7); the calendar mapping is the team's own sizing — recorded as an assumption in 08 §5.</text>
</svg>
